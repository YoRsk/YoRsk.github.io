backend:
  name: github
  repo: YoRsk/YoRsk_astro
  branch: main

# ⚠️ site_url 必须带 base（与 astro-paper.config.ts 的 site.url 保持一致）
site_url: https://yorsk.github.io/YoRsk_astro/
logo_url: https://yorsk.github.io/YoRsk_astro/favicon.svg

# 全局图库
# media_folder: 仓库根目录即项目根，直接写相对路径
# public_folder: 绝对禁止写成 /images/uploads —— 在 /YoRsk_astro 子目录下必 404。
#   用 @/assets/... 别名，构建期由 astro:assets 解析、优化并自动补上 base，
#   切换正式域名时【无需改动】。
media_folder: src/assets/images/uploads
public_folder: "@/assets/images/uploads"

collections:
  # ============ 博客文章 ============
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    path: "{{slug}}.md"
    create: true
    slug: "{{slug}}"
    sortable_fields: [pubDatetime, title]
    media_folder: ""
    public_folder: ""
    summary: "{{title}} — {{year}}-{{month}}-{{day}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 发布日期
        name: pubDatetime
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
      # description 是 zod schema 的必填字段，缺失会导致 CI 构建失败，故设为 required
      - { label: 摘要, name: description, widget: text, required: true }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 正文, name: body, widget: markdown }

  # ============ 笔记区 ============
  - name: notes
    label: 笔记
    label_singular: 笔记
    folder: src/content/notes
    path: "{{slug}}.md"
    create: true
    slug: "{{slug}}"
    sortable_fields: [pubDatetime, title]
    media_folder: ""
    public_folder: ""
    summary: "{{title}} — {{year}}-{{month}}-{{day}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 日期
        name: pubDatetime
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
      # description 是 zod schema 的必填字段，缺失会导致 CI 构建失败，故设为 required
      - { label: 摘要, name: description, widget: text, required: true }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 正文, name: body, widget: markdown }
