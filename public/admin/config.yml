backend:
  name: github
  # 2026-10-11 起仓库改名为 YoRsk.github.io（用户站点，发布在根域）
  repo: YoRsk/YoRsk.github.io
  branch: main

# ⚠️ site_url 必须与 astro-paper.config.ts 的 site.url 保持一致
site_url: https://yorsk.github.io/
logo_url: https://yorsk.github.io/favicon.svg

# 全局图库
# media_folder: 仓库根目录即项目根，直接写相对路径
# public_folder: 绝对禁止写成 /images/uploads —— 在子目录下部署时必 404。
#   用 @/assets/... 别名，构建期由 astro:assets 解析、优化并自动补上 base，
#   切换正式域名时【无需改动】。
media_folder: src/assets/images/uploads
public_folder: "@/assets/images/uploads"

# ⚠️【重要】name 是标识符，不是显示名：
#   1. 必须与 Astro 内容目录名一致（src/content/posts、src/content/notes）
#   2. 「编辑本页」深链硬编码了 #/collections/posts/entries/<slug>
#      改 name 会让每篇文章的编辑入口直接 404
#   CMS 界面上显示的是 label —— 要改显示名请改 label，绝不要动 name。
collections:
  # ============ 博客文章 ============
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    # ⚠️ 这里【不要】写 path。Decap 会在 path 模板后面自动追加 extension（默认 md），
    # 写成 path: "{{slug}}.md" 实际去找的是 "xxx.md.md"，于是 collection 读到 0 篇
    #（线上曾因此显示 0 篇文章，但 assets 面板正常 —— backend 没问题，是路径模板错了）。
    # 本仓库是扁平结构（folder 下直接就是 xxx.md），不需要 path；官方只在
    # 嵌套结构 xxx/index.md 时才写 path: "{{slug}}/index"（同样不带 .md）。
    create: true
    slug: "{{slug}}"
    sortable_fields: [pubDatetime, title]
    media_folder: ""
    public_folder: ""
    # summary 里引用的字段必须在下面 fields 中存在，否则 Sveltia 会报
    # "The summary option refers to xxx, but no such field is defined" 并拒绝加载配置。
    # 原先写的 {{year}}/{{month}}/{{day}} 从未定义过 —— 日期一律走 pubDatetime。
    summary: "{{title}} · {{pubDatetime}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Published
        name: pubDatetime
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      # description 是 zod schema 的必填字段，缺失会导致 CI 构建失败，故设为 required
      - { label: Description, name: description, widget: text, required: true }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown }

  # ============ 笔记区 ============
  - name: notes
    label: Notes
    label_singular: Note
    folder: src/content/notes
    # ⚠️ 这里【不要】写 path。Decap 会在 path 模板后面自动追加 extension（默认 md），
    # 写成 path: "{{slug}}.md" 实际去找的是 "xxx.md.md"，于是 collection 读到 0 篇
    #（线上曾因此显示 0 篇文章，但 assets 面板正常 —— backend 没问题，是路径模板错了）。
    # 本仓库是扁平结构（folder 下直接就是 xxx.md），不需要 path；官方只在
    # 嵌套结构 xxx/index.md 时才写 path: "{{slug}}/index"（同样不带 .md）。
    create: true
    slug: "{{slug}}"
    sortable_fields: [pubDatetime, title]
    media_folder: ""
    public_folder: ""
    # summary 里引用的字段必须在下面 fields 中存在，否则 Sveltia 会报
    # "The summary option refers to xxx, but no such field is defined" 并拒绝加载配置。
    # 原先写的 {{year}}/{{month}}/{{day}} 从未定义过 —— 日期一律走 pubDatetime。
    summary: "{{title}} · {{pubDatetime}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Date
        name: pubDatetime
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      # description 是 zod schema 的必填字段，缺失会导致 CI 构建失败，故设为 required
      - { label: Description, name: description, widget: text, required: true }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown }
